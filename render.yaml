services:
  - type: web
    name: atmos-dialogflow-weather-bot
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: OPENWEATHER_ONE_CALL_ENABLED
        value: "false"
      - key: OPEN_METEO_FALLBACK
        value: "true"
      - key: DEFAULT_TIME_ZONE
        value: UTC
      - key: WEATHER_UNITS
        value: metric
      - key: WEATHER_LANGUAGE
        value: en
      - key: UPSTREAM_TIMEOUT_MS
        value: "3500"
